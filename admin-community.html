<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Market Community admin - Vico Pay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050812;color:#e8eefc;font-family:Arial,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #22304b;background:#071025;flex-wrap:wrap}.logo{font-weight:900;font-size:21px;margin-right:auto}.logo span{color:#ffc83d}
.wrap{width:min(1150px,96%);margin:20px auto}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.b{border:0;border-radius:12px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:#0787ed}.b.red{background:#e11d48}.b.gray{background:#334155}.b.green{background:#16a34a}.b.sm{padding:5px 11px;font-size:12px}.b.on{background:#7c3aed}
.panel{background:#0a1328;border:1px solid #203352;border-radius:14px;padding:16px;margin-bottom:16px}.muted{color:#8fa7c5;font-size:13px}
input,select{padding:9px 12px;border-radius:10px;border:1px solid #2a4066;background:#050c1c;color:#fff;font:inherit}input.n{width:130px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.item{display:flex;gap:14px;background:#0a1328;border:1px solid #203352;border-radius:14px;padding:14px;margin-bottom:10px;flex-wrap:wrap}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px;background:#111c36}.item .t{flex:1;min-width:240px}
.flag{background:#7c2d12;border-radius:8px;padding:3px 8px;font-size:12px;margin:3px 3px 0 0;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1b2b47}th{color:#8fa7c5}
.gate{max-width:420px;margin:12vh auto;background:#0a1328;border:1px solid #203352;border-radius:16px;padding:26px}.gate input{width:100%;margin:12px 0}.err{color:#ff9fb5;font-size:13px;min-height:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}#toast.bad{background:#e11d48}
</style></head><body>
<div id="gate" class="gate"><h2 style="margin:0">Admin sign in</h2><p class="muted">Enter the ADMIN_KEY from your server's .env file. It is only kept in this tab.</p>
<input id="key" type="password" placeholder="ADMIN_KEY" onkeydown="if(event.key==='Enter')enter()"><button class="b" style="width:100%;padding:11px" onclick="enter()">Open</button><div class="err" id="err"></div></div>
<div id="app" style="display:none"><header><div class="logo">Vico Pay <span>Community admin</span></div><a href="admin.html" class="b gray" style="text-decoration:none">← Dashboard</a><button class="b gray" onclick="sessionStorage.removeItem('vk');location.reload()">Lock</button></header>
<div class="wrap"><div class="tabs"><button class="b on" data-t="ads">Ad review</button><button class="b gray" data-t="id">ID checks</button><button class="b gray" data-t="mo">Orders &amp; withdrawals</button><button class="b gray" data-t="pl">Ad placements</button><button class="b gray" data-t="set">Ad prices &amp; limits</button><button class="b gray" data-t="mk">Marketplace reports</button><button class="b gray" data-t="ai">Vico AI usage</button></div><div id="view"></div></div></div>
<div id="toast"></div>
<script>
var KEY=sessionStorage.getItem("vk")||"",TAB="ads",ST="under_review";
async function api(p,body){var r=await fetch(p,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:body?JSON.stringify(body):undefined});var d=await r.json().catch(function(){return{};});d._ok=r.ok;return d;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="";},2400);}
async function enter(){KEY=document.getElementById("key").value.trim()||KEY;var d=await api("/api/admin/ads/settings");if(!d.success){document.getElementById("err").textContent="Wrong key.";return;}sessionStorage.setItem("vk",KEY);document.getElementById("gate").style.display="none";document.getElementById("app").style.display="";show();}
document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;[].forEach.call(this.children,function(x){x.className="b "+(x===b?"on":"gray");});show();};
function show(){({ads:ads,id:idChecks,mo:money,pl:placements,set:settings,mk:market,ai:aiUse})[TAB]();}
async function ads(){var d=await api("/api/admin/ads/campaigns?status="+ST),v=document.getElementById("view");
  v.innerHTML='<div class="row" style="margin:0 0 12px"><select id="st" onchange="ST=this.value;ads()">'+["under_review","approved","rejected","draft","all"].map(function(s){return '<option value="'+s+'"'+(s===ST?" selected":"")+'>'+s.replace("_"," ")+'</option>';}).join("")+'</select></div>'+
  ((d.campaigns||[]).map(function(c){return '<div class="item">'+(c.imageUrl?'<img alt="" src="'+c.imageUrl+'" onerror="this.style.display=\'none\'">':"")+'<div class="t"><b>#'+c.id+' '+esc(c.name)+'</b> <span class="muted">('+esc(c.status)+')</span><div class="muted">'+esc(c.owner)+' · '+esc(c.adType)+' · ₦'+Number(c.budget).toLocaleString()+' · '+esc(c.start)+' → '+esc(c.end)+'</div><div style="margin-top:6px"><b>'+esc(c.headline)+'</b><br>'+esc(c.body)+'</div><div class="muted" style="margin-top:6px">Paid: '+(c.flow&&c.flow.paid?'₦'+Number(c.flow.amountPaid||0).toLocaleString()+' · ref '+esc(c.flow.paymentRef):'NO')+' · ID: '+esc(c.identity.status)+' · Phone '+esc(c.flow.phone)+' · '+esc(c.flow.cCity)+', '+esc(c.flow.cState)+' · age '+esc(c.flow.age)+' · Market address: '+esc(c.flow.marketAddress)+' · Placements: '+esc((c.placements||[]).join(", "))+' · Sell in Vico market: '+(c.flow.sellInMarket===null?"—":c.flow.sellInMarket?"yes ("+esc(c.flow.deliveryPref)+")":"no")+'</div><div class="muted" style="margin-top:6px">Button: '+esc(c.cta)+' · Link: '+esc(c.link)+' · Audience: '+esc(c.audienceMode)+', '+esc(c.state||"all states")+', '+esc(c.language)+', age '+c.ageMin+'-'+c.ageMax+'</div>'+(c.flags||[]).map(function(f){return '<span class="flag">'+esc(f)+'</span>';}).join("")+(c.rejectReason?'<div class="flag">Rejected: '+esc(c.rejectReason)+'</div>':"")+
  '<div class="row">'+(c.status==="under_review"?'<button class="b green sm" onclick="dec('+c.id+',\'approve\')">Approve</button>':"")+(c.status==="under_review"||c.status==="approved"?'<button class="b red sm" onclick="dec('+c.id+',\'reject\')">Reject</button>':"")+'<button class="b gray sm" onclick="sus(\''+esc(c.owner)+'\')">Suspend advertiser</button>'+(c.flow&&c.flow.paid&&c.status!=="cancelled"?'<button class="b red sm" onclick="refund('+c.id+')">Cancel and refund</button>':"")+'</div></div></div>';}).join("")||'<div class="panel muted">Nothing here.</div>');}
async function dec(id,a){var body={};if(a==="reject"){var r=prompt("Reason the advertiser will read:");if(!r)return;body.reason=r;}var d=await api("/api/admin/ads/campaigns/"+id+"/"+a,body);toast(d.success?"Done.":d.message,!d.success);ads();}
async function refund(id){if(!confirm("Cancel this ad and mark the payment for refund?"))return;var d=await api("/api/admin/ads/campaigns/"+id+"/refund",{});if(d.success)alert("Marked. Now refund ₦"+Number(d.amount).toLocaleString()+" (reference "+d.paymentRef+") from your Paystack dashboard.");else toast(d.message,true);ads();}
async function sus(e){if(!confirm("Suspend "+e+"? They cannot create or submit ads."))return;var d=await api("/api/admin/ads/advertisers/suspend",{email:e,suspend:true});toast(d.success?"Suspended.":d.message,!d.success);}
async function idChecks(){var d=await api("/api/admin/ads/identity?status=pending");document.getElementById("view").innerHTML='<div class="muted" style="margin-bottom:10px">Compare the document with what the advertiser entered. The photo is deleted when you decide. Every look at a document is logged.</div>'+((d.identities||[]).map(function(i){var e=i.entered||{};return '<div class="item">'+(i.hasImage?'<a href="#" onclick="viewId(\''+esc(i.email)+'\');return false"><img alt="Open document" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" style="background:#243b6b"></a>':"")+'<div class="t"><b>'+esc(i.docLabel)+'</b> · name on document: <b>'+esc(i.fullName)+'</b><div class="muted">Account: '+esc(i.email)+' · Advertiser name: <b>'+esc(i.advertiserName)+'</b> '+esc(i.businessName||"")+'</div><div class="muted">Entered: phone '+esc(e.phone)+' · age '+esc(e.age)+' · '+esc(e.city)+', '+esc(e.state)+' · '+esc(e.country)+' · market address: '+esc(e.marketAddress)+'</div><div class="row"><button class="b gray sm" onclick="viewId(\''+esc(i.email)+'\')">View document</button><button class="b green sm" onclick="idDec(\''+esc(i.email)+'\',\'approve\')">Approve</button><button class="b red sm" onclick="idDec(\''+esc(i.email)+'\',\'reject\')">Reject</button></div></div></div>';}).join("")||'<div class="panel muted">No documents waiting.</div>');}
async function viewId(email){var r=await fetch("/api/admin/ads/identity/"+encodeURIComponent(email)+"/image",{headers:{"x-admin-key":KEY}});if(!r.ok){toast("Could not open the document.",true);return;}var u=URL.createObjectURL(await r.blob());window.open(u,"_blank");}
async function idDec(email,a){var body={decision:a};if(a==="reject"){var r=prompt("Reason the advertiser will read (for example: name does not match):");if(!r)return;body.reason=r;}var d=await api("/api/admin/ads/identity/"+encodeURIComponent(email)+"/decision",body);toast(d.success?"Saved.":d.message,!d.success);idChecks();}
async function money(){var d=await api("/api/admin/commerce/overview"),S=d.settings||{};document.getElementById("view").innerHTML=
 '<div class="panel"><b>Marketplace money</b><div class="muted">Paid orders: '+d.paidOrders+' · Sales total: ₦'+Number(d.salesTotal||0).toLocaleString()+'</div><div class="row"><span class="muted">Vico commission %</span><input class="n" id="m1" type="number" value="'+S.commissionPercent+'"><span class="muted">Release money after (days)</span><input class="n" id="m2" type="number" value="'+S.releaseDays+'"><span class="muted">Smallest withdrawal ₦</span><input class="n" id="m3" type="number" value="'+S.minWithdrawal+'"><button class="b green sm" onclick="saveM()">Save</button></div></div>'+
 '<div class="panel"><b>Withdrawal requests (pay these from your bank, then mark paid)</b>'+((d.withdrawals||[]).map(function(w){return '<div class="item"><div class="t"><b>₦'+Number(w.amount).toLocaleString()+'</b> · '+esc(w.seller)+'<div class="muted">'+esc(w.bank)+' · '+esc(w.accountNumber)+' · '+esc(w.accountName)+'</div><div class="row"><button class="b green sm" onclick="wd('+w.id+',\'paid\')">Mark paid</button><button class="b red sm" onclick="wd('+w.id+',\'reject\')">Decline</button></div></div></div>';}).join("")||'<div class="muted">None waiting.</div>')+'</div>'+
 '<div class="panel"><b>Orders needing a decision</b>'+((d.orders||[]).map(function(o){return '<div class="item"><div class="t"><b>#'+o.id+' '+esc(o.title)+'</b> · ₦'+Number(o.amount).toLocaleString()+' · '+esc(o.status)+'<div class="muted">Seller '+esc(o.seller)+' · buyer '+esc(o.buyer)+'</div><div>'+esc(o.reason||"")+'</div><div class="row">'+(o.status==="disputed"?'<button class="b green sm" onclick="od('+o.id+',\'release\')">Pay the seller</button>':"")+'<button class="b red sm" onclick="od('+o.id+',\'refund\')">Refund the buyer</button></div></div></div>';}).join("")||'<div class="muted">None.</div>')+'</div>';}
async function saveM(){var d=await api("/api/admin/commerce/settings",{commissionPercent:document.getElementById("m1").value,releaseDays:document.getElementById("m2").value,minWithdrawal:document.getElementById("m3").value});toast(d.success?"Saved.":d.message,!d.success);}
async function wd(id,a){var ref=a==="paid"?prompt("Bank transfer reference (optional):")||"":"";var d=await api("/api/admin/commerce/withdrawals/"+id,{action:a,reference:ref});toast(d.success?"Done.":d.message,!d.success);money();}
async function od(id,a){if(!confirm(a==="refund"?"Refund the buyer? You must send the refund from your Paystack dashboard.":"Pay the seller?"))return;var d=await api("/api/admin/commerce/orders/"+id+"/resolve",{action:a});if(d.success&&d.note)alert(d.note);else toast(d.success?"Done.":d.message,!d.success);money();}
async function placements(){var d=await api("/api/admin/ads/settings"),open=(d.settings||{}).activePlacements||[];
  document.getElementById("view").innerHTML='<div class="panel"><b>Ad placements</b><div class="muted">Launch plan: Version 1 Short Videos · Version 2 Marketplace, Search Results · Version 3 Discovery · Version 4 Business Profiles, Creator Videos · Version 5 Promotions, Events. Do not open everything on day one. Advertisers can only choose the placements you switch on.</div>'+
  (d.placements||[]).map(function(p){return '<div class="row"><label style="display:flex;gap:10px;align-items:center;min-width:300px"><input type="checkbox" class="pc" value="'+p.id+'"'+(open.indexOf(p.id)>=0?" checked":"")+'> '+p.icon+' <b>'+esc(p.label)+'</b></label><span class="muted">'+(p.version?"Version "+p.version:"No stage yet")+'</span></div>';}).join("")+
  '<div class="row"><button class="b green" onclick="savePl()">Save placements</button></div></div>';}
async function savePl(){var l=[].filter.call(document.querySelectorAll(".pc"),function(c){return c.checked;}).map(function(c){return c.value;});var d=await api("/api/admin/ads/settings",{activePlacements:l});toast(d.success?"Saved.":d.message,!d.success);}
async function settings(){var d=await api("/api/admin/ads/settings"),s=d.settings||{};
  document.getElementById("view").innerHTML='<div class="panel"><b>Ad prices and limits</b><div class="muted">Impressions are only estimated for advertisers when a price per 1,000 views (CPM) is set. Leave it 0 until you have real delivery data.</div>'+
  '<div class="row"><span class="muted">Budget choices (₦, comma separated)</span><input id="s1" value="'+esc((s.budgets||[]).join(","))+'" style="width:320px"></div>'+
  '<div class="row"><span class="muted">Smallest budget ₦</span><input class="n" id="s2" type="number" value="'+s.minBudget+'"><span class="muted">Largest budget ₦</span><input class="n" id="s3" type="number" value="'+s.maxBudget+'"></div>'+
  '<div class="row"><span class="muted">Price per 1,000 views ₦ (CPM)</span><input class="n" id="s4" type="number" value="'+s.cpmNgn+'"><span class="muted">Fees and taxes %</span><input class="n" id="s5" type="number" value="'+s.feePercent+'"></div><div class="row"><button class="b green" onclick="saveSet()">Save</button></div></div>';}
async function saveSet(){var d=await api("/api/admin/ads/settings",{budgets:document.getElementById("s1").value.split(",").map(Number),minBudget:document.getElementById("s2").value,maxBudget:document.getElementById("s3").value,cpmNgn:document.getElementById("s4").value,feePercent:document.getElementById("s5").value});toast(d.success?"Saved.":d.message,!d.success);}
async function market(){var d=await api("/api/admin/market/listings?status=hidden");document.getElementById("view").innerHTML='<div class="muted" style="margin-bottom:10px">Items hidden after 3 reports. Restore if they are fine, remove if not.</div>'+((d.listings||[]).map(function(l){return '<div class="item">'+(l.imageUrl?'<img alt="" src="'+l.imageUrl+'" onerror="this.style.display=\'none\'">':"")+'<div class="t"><b>#'+l.id+' '+esc(l.title)+'</b> · ₦'+Number(l.price).toLocaleString()+'<div class="muted">Seller: '+esc(l.seller)+' · reports: '+l.reports+'</div><div>'+esc(l.description)+'</div><div class="row"><button class="b green sm" onclick="mk('+l.id+',\'restore\')">Restore</button><button class="b red sm" onclick="mk('+l.id+',\'remove\')">Remove</button></div></div></div>';}).join("")||'<div class="panel muted">No reported items.</div>');}
var _market=market;market=async function(){await _market();var d=await api("/api/admin/video-reports");document.getElementById("view").insertAdjacentHTML("beforeend",'<div class="muted" style="margin:18px 0 10px"><b>Reported videos</b> (hidden after 3 reports)</div>'+((d.videos||[]).map(function(v){return '<div class="item"><div class="t"><b>#'+v.id+' '+esc(v.title)+'</b> <span class="muted">('+esc(v.status)+')</span><div class="muted">Owner: '+esc(v.owner)+' · reports: '+v.reports+'</div><div>'+esc(v.reason)+'</div><div class="row">'+(v.status==="hidden"?'<button class="b green sm" onclick="vrest('+v.id+')">Restore</button>':"")+'<button class="b red sm" onclick="vrem('+v.id+')">Remove</button></div></div></div>';}).join("")||'<div class="muted">No reported videos.</div>'));};
async function vrest(id){var d=await api("/api/admin/videos/"+id+"/restore",{});toast(d.success?"Restored.":d.message,!d.success);market();}
async function vrem(id){if(!confirm("Remove this video for good?"))return;var d=await api("/api/admin/videos/"+id+"/remove",{});toast(d.success?"Removed.":d.message,!d.success);market();}
async function mk(id,a){var d=await api("/api/admin/market/listings/"+id+"/action",{action:a});toast(d.success?"Done.":d.message,!d.success);market();}
async function aiUse(){var d=await api("/api/admin/ai/usage");document.getElementById("view").innerHTML='<div class="panel"><b>Vico AI</b><div class="muted">'+(d.enabled?"Switched ON":"OFF: AI_API_KEY is not set in .env")+' · provider '+esc(d.provider)+' · model '+esc(d.model)+' · '+d.dailyLimit+' messages per user per day</div></div><div class="panel"><table><thead><tr><th>Day</th><th>Model</th><th>Questions</th><th>Input tokens</th><th>Output tokens</th></tr></thead><tbody>'+((d.days||[]).map(function(x){return '<tr><td>'+esc(x.day)+'</td><td>'+esc(x.model)+'</td><td>'+x.calls+'</td><td>'+x.input.toLocaleString()+'</td><td>'+x.output.toLocaleString()+'</td></tr>';}).join("")||'<tr><td colspan="5" class="muted">No usage yet.</td></tr>')+'</tbody></table></div><div class="panel"><b>Busiest today</b><div class="muted">'+((d.topToday||[]).map(function(t){return esc(t.email)+' — '+t.calls;}).join("<br>")||"Nobody yet.")+'</div></div>';}
if(KEY)enter();
</script></body></html>
