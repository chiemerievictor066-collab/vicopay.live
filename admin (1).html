<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Admin - VicoPay Live</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050812;color:#e8eefc;font-family:Arial,sans-serif}header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #22304b;background:#071025;flex-wrap:wrap}.logo{font-weight:900;font-size:21px;margin-right:auto}.logo span{color:#20d8ff}
.wrap{width:min(1150px,96%);margin:20px auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #2a4066;background:#0a1328;color:#cfe3ff;border-radius:18px;padding:8px 15px;font:inherit;font-weight:700;cursor:pointer}.tab.on{background:#0787ed;border-color:#0787ed;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card{background:#0a1328;border:1px solid #203352;border-radius:14px;padding:16px}.card b{display:block;font-size:26px}.card span{color:#8fa7c5;font-size:13px}
table{width:100%;border-collapse:collapse;background:#0a1328;border-radius:12px;overflow:hidden;font-size:13px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #1b2b47;vertical-align:top}th{color:#8fa7c5;font-weight:700;background:#0c1730}.tw{overflow-x:auto}
input{padding:10px 14px;border-radius:10px;border:1px solid #2a4066;background:#0a1328;color:#fff;font:inherit}.b{border:0;border-radius:14px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:#0787ed;font-size:12px}.b.red{background:#e11d48}.b.gray{background:#334155}.tag{background:#e11d48;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900}.tag.g{background:#16a34a}
.login{max-width:420px;margin:12vh auto;background:#0a1328;border:1px solid #203352;border-radius:16px;padding:26px}.login input{width:100%;margin:12px 0}.err{color:#ff9fb5;font-size:13px;min-height:18px}</style></head><body>
<div id="gate" class="login"><h2 style="margin:0">Admin sign in</h2><p style="color:#8fa7c5;font-size:13px">Enter the ADMIN_KEY from your server's .env file. It is only kept in this tab.</p><input id="key" type="password" placeholder="ADMIN_KEY" onkeydown="if(event.key==='Enter')enter()"><button class="b" style="width:100%;padding:11px" onclick="enter()">Open dashboard</button><div class="err" id="err"></div></div>
<div id="app" style="display:none"><header><div class="logo">VicoPay <span>Admin</span></div><a href="admin-payouts.html" class="b" style="margin-left:auto;text-decoration:none;background:#f5b400;color:#1a1305">💸 Payouts</a><button class="b gray" style="margin-left:8px" onclick="sessionStorage.removeItem('vk');location.reload()">Lock</button></header>
<div class="wrap"><div class="tabs" id="tabs"></div><div id="view"></div></div></div>
<script>
const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML};
const num=n=>Number(n||0).toLocaleString();let KEY=sessionStorage.getItem("vk")||"",tab="overview";
async function api(p,body){const r=await fetch(p,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));d._ok=r.ok;return d;}
async function enter(){KEY=document.getElementById("key").value||KEY;const d=await api("/api/admin/overview");if(!d._ok){err.textContent="Wrong key (or ADMIN_KEY is not set on the server).";return;}sessionStorage.setItem("vk",KEY);gate.style.display="none";app.style.display="block";draw();}
const TABS={overview:"Overview",users:"Users",lives:"Live now",reports:"Reports",withdrawals:"Withdrawals",support:"Support"};
function draw(){tabs.innerHTML=Object.keys(TABS).map(k=>'<button class="tab'+(k===tab?" on":"")+'" onclick="tab=\''+k+'\';draw()">'+TABS[k]+"</button>").join("");({overview,users,lives,reports,withdrawals,support})[tab]();}
async function overview(){const d=await api("/api/admin/overview");const c=[["Users",d.users],["Banned",d.banned],["Live now",d.liveNow],["Watching now",d.viewersNow],["Active PK",d.activePK],["Follows",d.follows],["Fan club members",d.fanMembers],["Gifts sent",d.giftsTotal],["Coins gifted",d.giftCoinsTotal],["Withdrawal requests",d.withdrawalRequests],["Open reports",d.openReports]];
  view.innerHTML='<div class="cards">'+c.map(x=>'<div class="card"><b>'+num(x[1])+"</b><span>"+x[0]+"</span></div>").join("")+"</div>";}
async function users(q){const d=await api("/api/admin/users?q="+encodeURIComponent(q||""));
  view.innerHTML='<p><input placeholder="Search email, username, name…" value="'+esc(q||"")+'" onkeydown="if(event.key===\'Enter\')users(this.value)"></p><div class="tw"><table><tr><th>User</th><th>Coins</th><th>Followers</th><th>Status</th><th></th></tr>'+(d.users||[]).map(u=>"<tr><td><b>"+esc(u.displayName)+"</b><br>"+esc(u.email)+" · @"+esc(u.username)+"</td><td>"+num(u.coins)+"</td><td>"+num(u.followers)+"</td><td>"+(u.banned?'<span class="tag">BANNED</span>':u.live?'<span class="tag g">LIVE</span>':"active")+'</td><td><button class="b '+(u.banned?"gray":"red")+'" onclick="ban(\''+esc(u.email)+"',"+!u.banned+')">'+(u.banned?"Unban":"Ban")+'</button> <button class="b" onclick="link(\''+esc(u.email)+'\')">Reset link</button></td></tr>').join("")+"</table></div>";}
async function ban(e,b){const reason=b?prompt("Reason for ban (optional)")||"":"";if(b&&!confirm("Ban "+e+"? Any live they are running will be ended."))return;await api("/api/admin/users/ban",{email:e,banned:b,reason});users();}
async function link(e){const d=await api("/api/admin/users/reset-link",{email:e});if(d.link)prompt("Send this one-time link (valid 30 min) to the user:",d.link);}
async function lives(){const d=await api("/api/admin/lives");view.innerHTML='<div class="tw"><table><tr><th>Host</th><th>Title</th><th>Viewers</th><th>Gifts</th><th></th></tr>'+((d.lives||[]).map(l=>"<tr><td>"+esc(l.displayName)+"<br>"+esc(l.email)+"</td><td>"+esc(l.title)+" ("+esc(l.category)+")"+(l.pkActive?" ⚔️":"")+"</td><td>"+num(l.viewers)+"</td><td>"+num(l.gifts)+'</td><td><a class="b" style="text-decoration:none" target="_blank" href="live-feed.html?room='+encodeURIComponent(l.roomId)+'">Watch</a> <button class="b red" onclick="endLive(\''+l.roomId+'\')">End live</button></td></tr>').join("")||'<tr><td colspan="5">Nobody is live.</td></tr>')+"</table></div>";}
async function endLive(id){if(!confirm("End this live now?"))return;await api("/api/admin/lives/end",{roomId:id});lives();}
async function reports(){const d=await api("/api/admin/reports");view.innerHTML='<div class="tw"><table><tr><th>When</th><th>Host</th><th>Reason</th><th>Status</th><th></th></tr>'+((d.reports||[]).map(r=>"<tr><td>"+new Date(r.ts).toLocaleString()+"</td><td>"+esc(r.hostId)+"</td><td>"+esc(r.reason)+"<br><small>by "+esc(r.reporter)+"</small></td><td>"+esc(r.status)+"</td><td>"+(r.status==="open"?'<button class="b" onclick="resolve('+r.id+')">Resolve</button>':"")+"</td></tr>").join("")||'<tr><td colspan="5">No reports.</td></tr>')+"</table></div>";}

async function support(st){st=st||"active";const d=await api("/api/admin/support/tickets?status="+st);const rows=(d.tickets||[]);
  view.innerHTML='<p><select onchange="support(this.value)" style="padding:9px 12px;border-radius:10px;border:1px solid #2a4066;background:#0a1328;color:#fff">'+[["active","Needs attention (open + answered)"],["open","Open"],["answered","Answered"],["resolved","Resolved"],["closed","Closed"],["all","All"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===st?" selected":"")+">"+o[1]+"</option>").join("")+'</select></p><div class="tw"><table><tr><th>#</th><th>User</th><th>Topic</th><th>Subject</th><th>Status</th><th>Updated</th><th></th></tr>'+(rows.map(t=>"<tr><td>"+t.id+"</td><td>"+esc(t.email)+"</td><td>"+esc(t.category)+"</td><td>"+esc(t.subject)+(t.lastFrom==="user"&&t.status!=="closed"&&t.status!=="resolved"?' <b style="color:#fbbf24">● waiting for you</b>':"")+"</td><td>"+esc(t.status)+"</td><td>"+new Date(t.updatedAt).toLocaleString()+'</td><td><button class="b" onclick="ticket('+t.id+')">Open</button></td></tr>').join("")||'<tr><td colspan="7">No tickets here.</td></tr>')+"</table></div>";}
async function ticket(id){const d=await api("/api/admin/support/tickets/"+id);if(!d.ticket){view.innerHTML="Ticket not found. ";return;}const t=d.ticket;
  view.innerHTML='<p><button class="b gray" onclick="support()">← All tickets</button></p><div class="card" style="margin-bottom:12px"><b style="font-size:18px">#'+t.id+" · "+esc(t.subject)+"</b><span>"+esc(t.email)+" · "+esc(t.category)+" · "+esc(t.status)+(t.reference?" · ref: "+esc(t.reference):"")+'</span><span style="display:block;margin-top:4px;font-size:11px;color:#6b7f9e">'+esc(t.userAgent)+"</span></div>"+
  d.messages.map(m=>'<div style="max-width:80%;margin:8px 0;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word;background:'+(m.from==="support"?"#17254a":"#1d4ed8")+";"+(m.from==="support"?"margin-left:auto":"")+'">'+esc(m.body)+'<br><small style="opacity:.7">'+(m.from==="support"?"You (support)":"User")+" · "+new Date(m.at).toLocaleString()+"</small></div>").join("")+
  '<textarea id="rb" placeholder="Write your reply…" style="width:100%;min-height:110px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #2a4066;background:#0a1328;color:#fff;font:inherit"></textarea><p><select id="rs" style="padding:9px 12px;border-radius:10px;border:1px solid #2a4066;background:#0a1328;color:#fff"><option value="answered">Mark as Answered</option><option value="resolved">Mark as Resolved</option><option value="open">Keep Open</option></select> <button class="b" onclick="sendTicket('+id+')">Send reply</button> <button class="b gray" onclick="setStatus('+id+',\'closed\')">Close ticket</button></p>';}
async function sendTicket(id){const body=document.getElementById("rb").value.trim();if(body.length<2)return alert("Write a reply first.");const d=await api("/api/admin/support/tickets/"+id+"/reply",{body,status:document.getElementById("rs").value});if(!d._ok)return alert(d.message||"Could not send.");ticket(id);}
async function setStatus(id,status){await api("/api/admin/support/tickets/"+id+"/status",{status});support();}
async function resolve(id){await api("/api/admin/reports/resolve",{id});reports();}
async function withdrawals(){const d=await api("/api/admin/creator-withdrawals");const rows=Object.values(d).find(Array.isArray)||[];
  const cols=rows.length?Object.keys(rows[0]).slice(0,9):[];view.innerHTML='<p style="color:#8fa7c5">Pay these manually, then record it in your own books. Nothing is sent automatically.</p><div class="tw"><table><tr>'+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>"+(rows.map(r=>"<tr>"+cols.map(c=>"<td>"+esc(r[c])+"</td>").join("")+"</tr>").join("")||"<tr><td>No withdrawal requests.</td></tr>")+"</table></div>";}
if(KEY)enter();
</script></body></html>
