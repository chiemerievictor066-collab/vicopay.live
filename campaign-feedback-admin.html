<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Feedback Review · VicoPay Admin</title><style>body{margin:0;background:#f3f6fb;color:#17233d;font:15px system-ui}.top{background:#071a39;color:#fff;padding:22px max(18px,calc((100% - 1100px)/2))}.wrap{max-width:1100px;margin:22px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e2eaf4;border-radius:15px;padding:18px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #cbd8ea;background:#fff;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.tabs button.on{background:#1769ff;color:#fff}.item{border-bottom:1px solid #e8edf4;padding:14px 0}.item:last-child{border:0}.muted{color:#6d7b91}.select{width:100%;padding:12px;border:1px solid #d6e0ed;border-radius:9px;font:inherit}</style></head><body><header class="top"><b>VicoPay · Competition Feedback Review</b><p style="color:#c7d9f5">Admin inspection desk for audience comments and viewer assessments. Viewer assessments are evidence for your review and do not automatically change official competition scores.</p></header><main class="wrap"><section class="panel"><label for="adminKey">VicoPay ADMIN_KEY</label><input id="adminKey" class="select" type="password" placeholder="Enter your ADMIN_KEY"><button id="connect" style="margin:10px 0;padding:10px 15px;background:#1769ff;color:white;border:0;border-radius:9px;font-weight:800">Connect admin</button><label for="event">Choose event</label><select id="event" class="select"><option value="">Loading events…</option></select><div class="tabs" style="margin-top:14px"><button class="on" data-tab="comments">Viewer comments</button><button data-tab="judgements">Viewer assessments</button></div></section><section class="panel"><h2 id="heading">Viewer comments</h2><div id="list" class="muted">Choose an event to inspect its feedback.</div></section></main><script>const $=s=>document.querySelector(s);let key=sessionStorage.getItem('vicoCampaignAdminKey')||'';$('#adminKey').value=key;let feedback={comments:[],judgements:[]},tab='comments';async function req(url){let r=await fetch(url,{headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok)throw Error(d.message||'Admin access required.');return d}async function loadEvents(){try{let d=await req('/api/admin/campaigns');$('#event').innerHTML='<option value="">Select an event</option>'+(d.events||[]).map(e=>`<option value="${e.id}">${e.title}</option>`).join('')}catch(e){$('#event').innerHTML='<option>'+e.message+'</option>'}}async function load(){let id=$('#event').value;if(!id)return;try{feedback=await req('/api/admin/campaigns/'+encodeURIComponent(id)+'/feedback');render()}catch(e){$('#list').textContent=e.message}}function render(){let rows=feedback[tab]||[];$('#heading').textContent=tab==='comments'?'Viewer comments ('+rows.length+')':'Viewer assessments ('+rows.length+')';$('#list').innerHTML=rows.map(x=>tab==='comments'?`<article class="item"><b>${esc(x.viewer_name)}</b> <span class="muted">on ${esc(x.participant||'event')}</span><p>${esc(x.comment)}</p><small class="muted">${new Date(Number(x.created_at)).toLocaleString()}</small></article>`:`<article class="item"><b>${esc(x.viewer_name)}</b> assessed <b>${esc(x.participant)}</b><p><strong>${x.score}/10</strong> — ${esc(x.comment||'No written note')}</p><small class="muted">${new Date(Number(x.created_at)).toLocaleString()}</small></article>`).join('')||'<p class="muted">No records in this section yet.</p>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#event').onchange=load;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});$('#connect').onclick=()=>{key=$('#adminKey').value.trim();if(!key)return alert('Enter your ADMIN_KEY.');sessionStorage.setItem('vicoCampaignAdminKey',key);loadEvents()};if(key)loadEvents();</script></body></html>
