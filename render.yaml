# Render Blueprint for Vico Pay Live.
# Uses your existing PostgreSQL provider (for example Neon); it does NOT create a new database.
# Render will ask you to enter every sync:false value during the first Blueprint deployment.
services:
  - type: web
    name: vicopay-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
