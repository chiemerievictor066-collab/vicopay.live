<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>VicoPay Super Admin Monitoring</title><style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#101d31;--line:#263a57;--muted:#91a6c2;--text:#edf4ff;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial}.login{max-width:430px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px}input,select,textarea{background:#091426;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}button,.btn{background:var(--blue);color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.muted{color:var(--muted)}header{position:sticky;top:0;z-index:2;background:#0b1628;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:19px;font-weight:900;margin-right:auto}.brand span{color:#60a5fa}.wrap{max-width:1500px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.tab{background:#14243b;color:#b8c9df;white-space:nowrap}.tab.active{background:var(--blue);color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:12px 0 20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.card strong{font-size:25px;display:block;margin-bottom:5px}.card small{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#9fb6d4;background:#12223a;position:sticky;top:0}td{max-width:360px;overflow-wrap:anywhere}.tag{padding:4px 7px;border-radius:6px;background:#243b5a;font-size:11px}.high,.critical{color:#fecaca;background:#7f1d1d}.medium{color:#fde68a;background:#78350f}.info{color:#bbf7d0;background:#14532d}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.error{color:#fca5a5}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:12px}header{padding:12px}.card strong{font-size:21px}}
</style></head><body>
<div id="gate" class="login"><h2>VicoPay Super Admin</h2><p class="muted">Secure monitoring console. Enter the server ADMIN_KEY. The key stays in this browser tab.</p><input id="key" type="password" placeholder="ADMIN_KEY" style="width:100%"><p><button style="width:100%" onclick="enter()">Unlock monitoring</button></p><div id="err" class="error"></div></div>
<div id="app" hidden><header><div class="brand">VicoPay <span>Super Admin</span></div><span class="muted" id="stamp"></span><button onclick="refresh()">Refresh data</button><button onclick="lock()" style="background:#334155">Lock</button></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="content"><div class="empty">Choose a monitoring area.</div></div></main></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), n=v=>Number(v||0).toLocaleString(), date=v=>v?new Date(Number(v)||v).toLocaleString():'—';let KEY=sessionStorage.getItem('vicoSuperAdminKey')||'',tab='overview';
const sections=[['overview','Overview'],['registrations','Customer registration'],['streamers','Active streamers & live'],['activity','Coins, gifts & withdrawals'],['marketplace','Marketplace'],['security','Security & investigations']];
async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'x-admin-key':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
async function enter(){KEY=$('key').value||KEY;try{await api('/api/admin/super-monitoring/overview');sessionStorage.setItem('vicoSuperAdminKey',KEY);$('gate').hidden=true;$('app').hidden=false;renderTabs();await show('overview')}catch(e){$('err').textContent='Access denied. Check ADMIN_KEY and try again.'}}
function lock(){sessionStorage.removeItem('vicoSuperAdminKey');KEY='';location.reload()}
function renderTabs(){$('tabs').innerHTML=sections.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('')}
function table(headers,rows){if(!rows?.length)return '<div class="empty">No records found for this section.</div>';return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${h[2]?h[2](r[h[0]],r):esc(r[h[0]]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function cards(items){return `<div class="cards">${items.map(([label,value,sub])=>`<div class="card"><strong>${n(value)}</strong><small>${esc(label)}${sub?'<br>'+esc(sub):''}</small></div>`).join('')}</div>`}
async function show(id){tab=id;renderTabs();$('content').innerHTML='<div class="empty">Loading records…</div>';try{let d;
if(id==='overview'){d=await api('/api/admin/super-monitoring/overview');$('stamp').textContent='Updated '+new Date(d.generatedAt).toLocaleTimeString();$('content').innerHTML=cards([['Registered customers',d.users.total,'All accounts'],['New accounts (24h)',d.users.new_24h,'Based on stored signup timestamps'],['Active live streams',d.live.total,'Heartbeat within 3 minutes'],['Total viewers ever recorded (not live)',d.viewers.total,'Saved history from your database; see Real-Time Operations for live viewers'],['Coin purchases (24h)',d.purchases.total,'Successful payments'],['Payment value (24h) ₦',d.purchases.ngn,'Successful payments'],['Gifts (24h)',d.gifts.total,n(d.gifts.coins)+' coins'],['Pending creator withdrawals',d.withdrawals.total,'Awaiting review'],['Marketplace orders (24h)',d.market.total,'₦'+n(d.market.gmv)+' order value'],['Open high-risk alerts',d.alerts.total,'Requires investigation'],['Non-success payments (24h)',d.failedPayments.total,'Review payment references']])+'<div class="panel"><b>Monitoring coverage</b><p class="muted">Customer records, active streams and heartbeat duration, payment and gift activity, creator withdrawals, marketplace orders, and security investigations are available in the sections above. Viewer counts reflect the platform’s stored host statistics, not a verified live unique-viewer feed.</p></div>';
}else if(id==='registrations'){d=await api('/api/admin/super-monitoring/registrations');$('content').innerHTML=table([['displayName','Customer'],['email','Email'],['username','Username'],['createdAt','Registered'],['signupIp','Signup IP'],['lastIp','Last IP'],['banned','Account status',v=>Number(v)?'<span class="tag high">BANNED</span>':'<span class="tag info">ACTIVE</span>']],d.rows)}
else if(id==='streamers'){d=await api('/api/admin/super-monitoring/streamers');$('content').innerHTML=table([['displayName','Streamer'],['email','Email'],['username','Username'],['roomId','Room'],['startedAt','Started',v=>date(v)],['durationSeconds','Duration',v=>Math.floor(Number(v||0)/60)+'m '+Number(v||0)%60+'s'],['lastBeat','Last heartbeat',v=>date(v)]],d.rows)}
else if(id==='activity'){d=await api('/api/admin/super-monitoring/activity');$('content').innerHTML='<div class="panel"><h3>Creator earnings summary</h3>'+table([['creator','Creator'],['gifts','Gifts received'],['earned_stars','Earned stars'],['gift_coins','Gift coins sent']],d.creatorEarnings)+'</div><div class="panel"><h3>Coin purchases / payment attempts</h3>'+table([['reference','Reference'],['email','Customer'],['coins','Coins'],['amount','Amount ₦'],['status','Status'],['createdAt','Time',v=>date(v)]],d.payments)+'</div><div class="panel"><h3>Gift transactions</h3>'+table([['gift','Gift'],['coin','Coins'],['sender','Sender'],['recipient','Creator'],['createdAt','Time',v=>date(v)]],d.gifts)+'</div><div class="panel"><h3>Creator withdrawals</h3>'+table([['creator','Creator'],['amount','Amount'],['currency','Currency'],['status','Status'],['securityStatus','Security'],['createdAt','Requested',v=>date(v)]],d.withdrawals)+'</div>'}
else if(id==='marketplace'){d=await api('/api/admin/super-monitoring/marketplace');$('content').innerHTML='<div class="panel"><h3>Marketplace orders and sales activity</h3>'+table([['id','Order'],['title','Item'],['seller','Seller'],['buyer','Buyer'],['amount','Amount ₦'],['status','Status'],['createdAt','Created',v=>date(v)]],d.orders)+'</div><div class="panel"><h3>Seller listing activity</h3>'+table([['seller','Seller'],['listings','Listings']],d.sellers)+'</div>'}
else if(id==='security'){d=await api('/api/admin/super-monitoring/security');$('content').innerHTML='<div class="panel"><h3>Login activity and security alerts</h3><p class="muted">Failed and successful logins are recorded with IP address and browser/device user-agent. Investigate unusual locations, repeated failures, and unfamiliar devices.</p>'+table([['type','Event'],['severity','Severity',v=>`<span class="tag ${esc(v)}">${esc(v)}</span>`],['email','Account'],['ip','IP address'],['device','Device / browser'],['detail','Details'],['createdAt','Time',v=>date(v)],['status','Case status'],['id','Action',(_,r)=>`<button onclick="investigate(${Number(r.id)},'investigating')">Investigate</button> <button style="background:#15803d" onclick="resolveCase(${Number(r.id)})">Resolve</button>`]],d.events)+'</div><div class="panel"><h3>Recent account IP records</h3>'+table([['email','Account'],['signupIp','Signup IP'],['lastIp','Last login IP']],d.recentIpActivity)+'</div>'}
}catch(e){$('content').innerHTML='<div class="panel error">'+esc(e.message)+'</div>'}}
async function investigate(id,status){let note=prompt('Investigation note (what was checked, evidence, next action):')||'';await api('/api/admin/super-monitoring/security/'+id+'/investigate',{status,note});show('security')}
async function resolveCase(id){let note=prompt('Resolution note:')||'';await api('/api/admin/super-monitoring/security/'+id+'/investigate',{status:'resolved',note});show('security')}
async function refresh(){await show(tab)}$('key').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});if(KEY)enter();setInterval(()=>{if(!$('app').hidden)show(tab)},30000);
</script></body></html>
