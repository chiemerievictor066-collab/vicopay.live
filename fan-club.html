<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fan Club - VicoPay Live</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050812;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #22304b;background:#071025}.logo{font-weight:900;font-size:23px;margin-right:auto}.logo span{color:#20d8ff}
header a{color:#cfe3ff;text-decoration:none;font-weight:700;font-size:14px}.wrap{width:min(900px,94%);margin:22px auto}h1{margin:0 0 4px}.sub{color:#8fa7c5;margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid #2a4066;background:#0a1328;color:#cfe3ff;border-radius:20px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.tab.on{background:#0787ed;border-color:#0787ed;color:#fff}
.row{display:flex;align-items:center;gap:12px;background:#0a1328;border:1px solid #203352;border-radius:14px;padding:12px 14px;margin-bottom:10px}.row .g{flex:1;min-width:0}.nm{font-weight:900}.s{color:#8fa7c5;font-size:12px;margin-top:2px}
.b{border:0;border-radius:18px;padding:8px 14px;font:inherit;font-weight:900;cursor:pointer;color:#fff;background:#0787ed;text-decoration:none;font-size:13px;white-space:nowrap}.b.on{background:#1f2f4d;color:#9bb0ca}.b.live{background:#ff315a}
.empty{padding:30px;text-align:center;color:#8fa7c5;background:#0a1328;border:1px dashed #2a4066;border-radius:14px}.lvl{background:#7c3aed;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.vs .sc{font-size:22px;font-weight:900;color:#ffd54a}.bar{height:12px;border-radius:7px;background:#ff315a;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#0787ed}
input.q{width:100%;padding:13px 16px;border-radius:24px;border:1px solid #2a4066;background:#0a1328;color:#fff;font:inherit;margin-bottom:14px}</style>
<script src="auth.js"></script><script>VicoAuth.requireLogin&&true&&VicoAuth.requireLogin();</script><script src="vico-ui.js"></script></head><body>
<header><div class="logo">VicoPay <span>Live</span></div><a href="live-room.html">Live</a><a href="hosts.html">Hosts</a><a href="followers.html">Followers</a><a href="pk-battles.html">PK</a><span id="bellSlot"></span></header><div class="wrap">
<h1 id="h">💜 Fan Club</h1><p class="sub" id="sub"></p><div id="act"></div><div id="list"></div>
<script>
const U=VicoUI,host=new URLSearchParams(location.search).get("host")||"me";
async function load(){const d=await U.api("/api/fanclub/"+encodeURIComponent(host));
  if(!d._ok){list.innerHTML='<div class="empty">'+U.esc(d.message||"Fan club not found.")+'</div>';return;}
  h.textContent="💜 "+d.host.displayName+"'s Fan Club";sub.textContent=U.num(d.memberCount)+" members · earn points by sending gifts · levels at "+d.levels.map(U.num).join(" / ")+" points";
  act.innerHTML=d.host.isLive?'<a class="b live" href="live-feed.html?room='+encodeURIComponent(d.host.roomId)+'">🔴 Watch live now</a> ':'';
  list.innerHTML=d.members.length?d.members.map((m,i)=>'<div class="row"><b>#'+(i+1)+'</b>'+U.avatar(m.displayName,false,null,40,'/api/avatar/'+encodeURIComponent(m.handle))+'<div class="g"><div class="nm">'+U.esc(m.displayName)+(m.isMe?' (you)':'')+'</div><div class="s">'+U.num(m.points)+' points</div></div><span class="lvl">Lv '+m.level+'</span></div>').join(""):'<div class="empty">No members yet — be the first to join from the live room.</div>';}
load();
</script></div><script>VicoUI.bell(document.getElementById("bellSlot"));</script></body></html>
