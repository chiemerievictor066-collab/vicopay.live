<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Applications | VicoPay Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233d;font:15px system-ui,Arial}.top{background:linear-gradient(120deg,#07162d,#124b9b);color:white;padding:24px max(18px,calc((100% - 1100px)/2))}.top a{color:#cce5ff}.top h1{margin:12px 0 5px}.wrap{max-width:1100px;margin:20px auto;padding:0 16px}.panel,.application{background:#fff;border:1px solid #e1e8f2;border-radius:14px;padding:17px;margin-bottom:14px}label{display:block;font-weight:700;margin:9px 0 5px}input,select,textarea{padding:11px;border:1px solid #d6e0ee;border-radius:8px;font:inherit;max-width:100%}input{width:min(100%,440px)}select{width:min(100%,440px)}textarea{width:100%;min-height:65px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#1769ff;color:white;font-weight:800;cursor:pointer;margin:6px 5px 0 0}.btn.secondary{background:#eaf1ff;color:#174b9c}.btn.danger{background:#b83245}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:220px}.muted{color:#68778e}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf3fc;font-size:12px}.notice{padding:10px;background:#eef5ff;border-radius:9px;margin-top:10px}.application h3{margin:8px 0}.application p{white-space:pre-wrap;line-height:1.45}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:600px){.top{padding:22px 16px}}
</style></head><body><header class="top"><a href="campaign-competition-admin.html">← Competition Control Room</a><h1>Competition applications</h1><div>Review applications and add selected applicants to a published event.</div></header><main class="wrap"><section class="panel"><div class="row"><div><label for="adminKey">ADMIN_KEY</label><input id="adminKey" type="password" placeholder="Your server ADMIN_KEY"></div><div><label for="status">Filter applications</label><select id="status"><option value="">All applications</option><option>new</option><option>reviewing</option><option>approved</option><option>declined</option><option>enrolled</option></select></div><div><button class="btn" id="connect">Connect / Refresh</button></div></div><p class="muted">The admin key is stored only in this browser tab's session storage.</p><div id="notice" class="notice" hidden></div></section><section id="applications"><p class="muted">Connect with your admin key to load applications.</p></section></main><script>
(()=>{const $=s=>document.querySelector(s);let key=sessionStorage.getItem('vicoCampaignAdminKey')||'',events=[];$('#adminKey').value=key;const headers=()=>({'Content-Type':'application/json','x-admin-key':key});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(s){$('#notice').hidden=false;$('#notice').textContent=s}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){key=$('#adminKey').value.trim();if(!key)return alert('Enter your ADMIN_KEY.');sessionStorage.setItem('vicoCampaignAdminKey',key);try{const [a,e]=await Promise.all([api('/api/admin/campaign-applications'+($('#status').value?'?status='+encodeURIComponent($('#status').value):'')),api('/api/admin/campaigns')]);events=e.events||[];render(a.applications||[])}catch(err){note(err.message)}}function render(rows){$('#applications').innerHTML=rows.length?rows.map(a=>`<article class="application"><div class="row"><div><span class="tag">${esc(a.status)}</span> <span class="tag">${esc(a.category)}</span><h3>${esc(a.applicant_name)}</h3><div class="muted">${esc(a.email)} · ${esc(a.phone)} · ${new Date(Number(a.created_at)).toLocaleString()}</div></div><div><label>Assign to competition</label><select id="event-${esc(a.id)}"><option value="">Choose published event</option>${events.filter(e=>['published','live'].includes(String(e.status).toLowerCase())).map(e=>`<option value="${esc(e.id)}" ${a.event_id===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></div></div><p><b>Experience:</b> ${esc(a.experience||'Not provided')}</p><p><b>Portfolio:</b> ${a.portfolio_url?`<a href="${esc(a.portfolio_url)}" target="_blank" rel="noopener">${esc(a.portfolio_url)}</a>`:'Not provided'}</p><p><b>Application:</b><br>${esc(a.message)}</p><label for="note-${esc(a.id)}">Admin note</label><textarea id="note-${esc(a.id)}">${esc(a.admin_note||'')}</textarea><div class="actions"><button class="btn secondary" onclick="window.review('${esc(a.id)}','reviewing')">Mark reviewing</button><button class="btn" onclick="window.review('${esc(a.id)}','approved')">Approve</button><button class="btn danger" onclick="window.review('${esc(a.id)}','declined')">Decline</button><button class="btn" onclick="window.enrol('${esc(a.id)}')">Add to selected competition</button></div></article>`).join(''):'<section class="panel">No applications found for this filter.</section>'}window.review=async(id,status)=>{try{const d=await api('/api/admin/campaign-applications/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,adminNote:$('#note-'+CSS.escape(id)).value})});note(d.message);load()}catch(e){note(e.message)}};window.enrol=async id=>{const eventId=$('#event-'+CSS.escape(id)).value;if(!eventId)return alert('Choose a published competition first.');try{const d=await api('/api/admin/campaign-applications/'+encodeURIComponent(id)+'/enrol',{method:'POST',body:JSON.stringify({eventId})});note(d.message);load()}catch(e){note(e.message)}};$('#connect').onclick=load;$('#status').onchange=load;if(key)load()})();
</script></body></html>
