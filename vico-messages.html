<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vico Messages - Vico Pay Live</title>
<link rel="stylesheet" href="gm.css">
<style>
/* Full-height, WhatsApp-style chat workspace */
body.gm[data-gm="messages"]{height:100dvh;min-height:100dvh;overflow:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.gm[data-gm="messages"] .gm-wrap{width:100%;max-width:none;height:calc(100dvh - 76px - env(safe-area-inset-bottom));margin:0;padding:0}
body.gm[data-gm="messages"] .hero{display:none}
.pane{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr);gap:0;height:100%;min-height:0;overflow:hidden;border:1px solid #c5dcf7;border-radius:0;background:#fff}
.side,.main{overflow:hidden;display:flex;flex-direction:column}
.find{display:flex;gap:6px;padding:10px;border-bottom:1px solid #c5dcf7}.find input{flex:1;min-width:0;border:1px solid #c5dcf7;border-radius:14px;padding:10px 12px;font:inherit}
#threads{flex:1;overflow:auto}.th{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #e3eefc;cursor:pointer}.th:hover,.th.on{background:#eaf3ff}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#1d6fe8,#6d28d9);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.th .t{flex:1;min-width:0}.th b{display:block;font-size:14.5px}.th small{display:block;color:#5d7096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th em{background:#ef4444;color:#fff;border-radius:10px;font:800 11px Arial;padding:2px 7px;font-style:normal}
.mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #c5dcf7;background:#fff;font-weight:900}.mh button{display:none;border:0;background:#eaf3ff;border-radius:12px;padding:7px 12px;font-weight:800;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f3f8ff}
.m{max-width:80%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;word-break:break-word;white-space:pre-wrap}.m.me{align-self:flex-end;background:#4c1d95;color:#fff;border-bottom-right-radius:4px}.m.th2{align-self:flex-start;background:#fff;border:1px solid #c5dcf7;border-bottom-left-radius:4px}
.m small{display:block;opacity:.65;font-size:10.5px;margin-top:3px}
#f{display:flex;gap:8px;padding:10px;border-top:1px solid #c5dcf7;background:#fff}#f input{flex:1;min-width:0;border:1px solid #c5dcf7;border-radius:18px;padding:12px 16px;font:inherit}
.empty{margin:auto;color:#5d7096;font-weight:700;text-align:center;padding:20px}
@media(max-width:760px){.pane{grid-template-columns:1fr}.pane.chat .side{display:none}.pane:not(.chat) .main{display:none}.mh button{display:inline-block}}

.side,.main{min-width:0;min-height:0;border-radius:0!important;box-shadow:none!important}
.side{border-right:1px solid #c5dcf7}
.main{height:100%;background:#fff}
.mh{min-height:62px;flex:0 0 auto}
#msgs{min-height:0;overscroll-behavior:contain}
#f{flex:0 0 auto;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#f input{outline:none}
#f input:focus,.find input:focus{border-color:#1d6fe8;box-shadow:0 0 0 3px #1d6fe822}
.find{flex:0 0 auto}
@media(max-width:760px){
  body.gm[data-gm="messages"] .gm-wrap{height:calc(100dvh - 76px - env(safe-area-inset-bottom))}
  .pane{grid-template-columns:minmax(0,1fr);height:100%;border-left:0;border-right:0}
  .pane:not(.chat) .side{display:flex}
  .pane:not(.chat) .main{display:none}
  .pane.chat .side{display:none}
  .pane.chat .main{display:flex}
  .side,.main{height:100%;min-height:0}
  .mh button{display:inline-flex;align-items:center;justify-content:center}
}
@media(min-width:761px){
  .pane .side,.pane .main{display:flex!important}
}

/* WhatsApp-inspired Vico Messages layout: familiar chat list, green sent bubbles and warm conversation canvas. */
.pane{border:1px solid #d6dedb;background:#fff}
.side{background:#fff;border-right:1px solid #d6dedb}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:17px 16px;background:#075e54;color:#fff;min-height:62px}
.sidehead b{font-size:19px}.sidehead span{font-size:11px;color:#d5eee8;font-weight:700}
.find{background:#f6f8f7;border-bottom:0;padding:10px 12px 6px}
.find input,.newchat input{border:0!important;background:#eaf0ed;border-radius:10px!important;padding:11px 13px!important;outline:none}
.find button{background:#dce9e4!important;color:#075e54!important;border:0}
.newchat{display:flex;gap:7px;padding:5px 12px 10px;background:#f6f8f7;border-bottom:1px solid #e2e9e6}
.newchat input{flex:1;min-width:0;font:inherit}
.newchat button{white-space:nowrap;background:#087e70!important}
.th{padding:13px 14px;border-bottom:1px solid #edf1ef;min-height:72px}
.th:hover,.th.on{background:#eaf5f1}
.th .av{background:linear-gradient(135deg,#087e70,#25a18e)}
.th b{color:#172b26}.th small{color:#687c75}
.mh{background:#075e54;color:#fff;border-bottom:0;min-height:62px}
.mh button{background:#ffffff25;color:#fff}
#msgs{background-color:#efeae2;background-image:radial-gradient(#d8d2c8 0.55px,transparent 0.55px);background-size:8px 8px}
.m{max-width:min(82%,560px);box-shadow:0 1px 1px #00000010;border:0!important;border-radius:9px!important;padding:8px 11px}
.m.me{background:#d9fdd3;color:#173c31;border-bottom-right-radius:2px!important}
.m.th2{background:#fff;color:#26332e;border-bottom-left-radius:2px!important}
.m small{color:#60756c;opacity:1;text-align:right;font-size:10px}
#f{background:#f0f2f0;border-top:1px solid #dce4df;gap:8px}
#f input{border:0;background:#fff;border-radius:22px;padding:12px 16px}
#f button{background:#087e70!important;border-radius:22px}
.empty{color:#687c75}
@media(max-width:760px){.sidehead{padding-top:calc(14px + env(safe-area-inset-top))}}
</style></head>
<body class="gm" data-gm="messages">
<div class="gm-wrap">
  <div class="hero"><h1>Vico Messages</h1><p>Chat · Connect · Share with your friends, buyers and sellers.</p></div>
  <div class="pane" id="pane">
    <div class="gm-card side"><div class="sidehead"><b>Vico Messages</b><span>Private chats</span></div><div class="find"><input id="searchChats" placeholder="Search chats"><button class="gm-btn sm" id="clearSearch" type="button" aria-label="Clear search">×</button></div><div class="newchat"><input id="who" placeholder="Start chat with @username"><button class="gm-btn sm" id="go" type="button">New chat</button></div><div id="threads"></div></div>
    <div class="gm-card main"><div class="mh" id="mh"><button id="back" type="button">‹</button><span id="mt">Select a conversation</span></div><div id="msgs"><div class="empty">Pick a chat on the left, or start a new one with a username.</div></div>
      <form id="f" style="display:none"><input id="in" maxlength="1000" placeholder="Write a message…" autocomplete="off"><button class="gm-btn" style="padding:0 20px">Send</button></form></div>
  </div>
</div>
<script src="auth.js"></script><script src="gm-nav.js"></script>
<script>
var cur=null,lastId=0,timer=null;
function av(p){return p.avatar?'<img class="av" src="'+gmEsc(p.avatar)+'" alt="">':'<div class="av">'+gmEsc((p.displayName||"?").charAt(0).toUpperCase())+'</div>';}
function ago(t){var s=(Date.now()-t)/1000;if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return new Date(t).toLocaleDateString();}
function loadThreads(){gmApi("/api/dm/threads").then(function(d){var el=document.getElementById("threads");if(!d.success){el.innerHTML='<div class="empty">'+gmEsc(d.message||"Log in to see your chats.")+'</div>';return;}
  el.innerHTML=d.threads.map(function(t){return '<div class="th'+(cur===t.handle?' on':'')+'" data-h="'+gmEsc(t.handle)+'">'+av(t)+'<div class="t"><b>'+gmEsc(t.displayName)+'</b><small>'+gmEsc(t.preview)+'</small></div><div style="text-align:right"><small>'+ago(t.lastAt)+'</small>'+(t.unread?'<em>'+t.unread+'</em>':'')+'</div></div>';}).join("")||'<div class="empty">No chats yet.</div>';});}
document.getElementById("threads").onclick=function(e){var t=e.target.closest(".th");if(t)openChat(t.dataset.h);};
document.getElementById("searchChats").oninput=function(){var q=this.value.trim().toLowerCase();document.querySelectorAll("#threads .th").forEach(function(t){t.style.display=t.textContent.toLowerCase().includes(q)?"":"none";});};
document.getElementById("clearSearch").onclick=function(){var s=document.getElementById("searchChats");s.value="";s.dispatchEvent(new Event("input"));};
function draw(list,mine){var el=document.getElementById("msgs");list.forEach(function(m){var d=document.createElement("div");d.className="m "+(m.mine?"me":"th2");d.innerHTML=gmEsc(m.body)+"<small>"+new Date(m.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"</small>";el.appendChild(d);lastId=Math.max(lastId,m.id);});el.scrollTop=el.scrollHeight;}
function openChat(h){if(!gmSignedIn()){gmNeedLogin();return;}cur=h;lastId=0;document.getElementById("pane").classList.add("chat");
  gmApi("/api/dm/with/"+encodeURIComponent(h)).then(function(d){if(!d.success){gmToast(d.message||"Could not open the chat.");document.getElementById("pane").classList.remove("chat");return;}
    document.getElementById("mt").textContent=d.with.displayName+" (@"+d.with.handle+")";document.getElementById("f").style.display="flex";
    var el=document.getElementById("msgs");el.innerHTML="";if(!d.messages.length)el.innerHTML='<div class="empty">Say hello 👋</div>';else draw(d.messages);loadThreads();clearInterval(timer);timer=setInterval(poll,5000);});}
function poll(){if(!cur||document.hidden)return;gmApi("/api/dm/with/"+encodeURIComponent(cur)+"?after="+lastId).then(function(d){if(d.success&&d.messages.length){var e=document.querySelector("#msgs .empty");if(e)e.remove();draw(d.messages);loadThreads();}});}
document.getElementById("f").onsubmit=function(e){e.preventDefault();var i=document.getElementById("in"),b=i.value.trim();if(!b||!cur)return;i.value="";
  gmApi("/api/dm/with/"+encodeURIComponent(cur),{body:{body:b}}).then(function(d){if(d.success){var e2=document.querySelector("#msgs .empty");if(e2)e2.remove();draw([d.message]);loadThreads();}else{gmToast(d.message||"Could not send.");i.value=b;}});};
document.getElementById("go").onclick=function(){var v=document.getElementById("who").value.trim().replace(/^@/,"");if(v)openChat(v);};
document.getElementById("who").onkeydown=function(e){if(e.key==="Enter")document.getElementById("go").click();};
document.getElementById("back").onclick=function(){document.getElementById("pane").classList.remove("chat");cur=null;clearInterval(timer);loadThreads();};
if(gmSignedIn()){loadThreads();var qs=new URLSearchParams(location.search),to=qs.get("to");if(to){openChat(to);if(qs.get("t"))setTimeout(function(){var i=document.getElementById("in");if(i&&!i.value)i.value="Hi, I am interested in “"+qs.get("t")+"”. Is it still available?";},900);}}else{document.getElementById("threads").innerHTML='<div class="empty">Log in to see your chats.</div>';}
</script></body></html>
