<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vico Trust Review</title><style>body{margin:0;background:#eef4ff;color:#13285b;font-family:Arial;padding:20px}.wrap{max-width:1050px;margin:auto}header,.card{background:#fff;border:1px solid #d6e4fa;border-radius:16px;padding:16px;margin-bottom:14px}input,textarea,select{padding:10px;border:1px solid #c8d8ef;border-radius:9px}button{border:0;border-radius:9px;padding:10px 14px;background:#0759d5;color:white;font-weight:800;cursor:pointer;margin:3px}.muted{color:#667998;font-size:13px}.item{border-top:1px solid #e5edf8;padding:12px 0;overflow-wrap:anywhere}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:200px}</style></head><body><main class="wrap"><header><h1>Vico Trusted Business — Admin Review</h1><p class="muted">Only approve after checking business identity, delivery records, review quality and fraud signals. Counts alone do not prove legitimacy.</p><div class="row"><input id="key" type="password" placeholder="ADMIN_KEY"><button id="save">Load reviews</button></div></header><section class="card"><h2>Trust milestone applications</h2><div id="trust">Enter your admin key to load.</div></section><section class="card"><h2>Pending customer reviews</h2><div id="reviews">Not loaded.</div></section></main><script>
(function(){var key='';function api(url,opts){opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json','x-admin-key':key},opts.headers||{});return fetch(url,opts).then(function(r){return r.json();});}function el(id){return document.getElementById(id);}function load(){key=el('key').value;api('/api/admin/business/trust').then(function(d){el('trust').innerHTML=(d.items||[]).map(function(x){return '<div class="item"><b>'+x.ownerEmail+'</b> · <b>'+x.status+'</b><div class="muted">Notified: '+(x.notifiedAt?new Date(Number(x.notifiedAt)).toLocaleString():'—')+'</div><input id="note-'+encodeURIComponent(x.ownerEmail)+'" placeholder="Review note"><button data-email="'+encodeURIComponent(x.ownerEmail)+'" data-status="verified">Approve Trusted</button><button data-email="'+encodeURIComponent(x.ownerEmail)+'" data-status="under_review">Under review</button><button data-email="'+encodeURIComponent(x.ownerEmail)+'" data-status="rejected">Reject</button></div>';}).join('')||'No trust milestone applications yet.';});api('/api/admin/business/reviews').then(function(d){el('reviews').innerHTML=(d.items||[]).map(function(x){return '<div class="item"><b>'+x.title+'</b> · '+x.rating+'/5 stars <div class="muted">'+x.reviewerEmail+'</div><p>'+x.comment+'</p><button data-review="'+x.id+'" data-rstatus="approved">Approve</button><button data-review="'+x.id+'" data-rstatus="rejected">Reject</button></div>';}).join('')||'No pending reviews.';});}el('save').onclick=load;document.body.addEventListener('click',function(e){var b=e.target.closest('[data-email]');if(b){var email=decodeURIComponent(b.dataset.email),note=el('note-'+encodeURIComponent(email)).value;api('/api/admin/business/trust/'+encodeURIComponent(email)+'/review',{method:'POST',body:JSON.stringify({status:b.dataset.status,note:note})}).then(function(d){alert(d.success?'Saved.':'Could not save.');load();});}var r=e.target.closest('[data-review]');if(r)api('/api/admin/business/reviews/'+r.dataset.review,{method:'POST',body:JSON.stringify({status:r.dataset.rstatus})}).then(function(d){alert(d.success?'Saved.':'Could not save.');load();});});})();
</script></body></html>
