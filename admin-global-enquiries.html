<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vico Pay Global Enquiries Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7ff;color:#172d52;font-family:Inter,system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{margin:0}.muted{color:#64748b}.bar,.card{background:white;border:1px solid #dce7f5;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #24446b0c}.controls{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea{border:1px solid #cbd8e9;border-radius:10px;padding:11px;font:inherit;width:100%}button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,#1687df,#6546c7);color:#fff;font-weight:800;cursor:pointer}.btn2{background:#e9f2ff;color:#1b4d88}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e1eaf5;border-radius:14px;padding:15px;margin:12px 0}.tag{display:inline-block;background:#eaf2ff;color:#24518d;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:800}.detail{white-space:pre-wrap;line-height:1.55;background:#f7faff;padding:12px;border-radius:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.actions section{background:#f8fbff;border-radius:12px;padding:13px}.actions textarea{min-height:95px}.msg{margin:10px 0;padding:10px;border-radius:9px;background:#eff6ff}.danger{color:#9f1239}@media(max-width:700px){.grid,.actions{grid-template-columns:1fr}.wrap{padding:13px}}
</style></head><body><main class="wrap"><header class="head"><div><h1>Global Enquiries</h1><p class="muted">Review enquiries, send official responses and issue Paystack invoices.</p></div><a href="global-market-community.html">← Global Market Community</a></header>
<div class="bar"><div class="controls"><input id="key" type="password" placeholder="Admin key (x-admin-key)" style="flex:1;min-width:220px"><select id="filter" style="max-width:190px"><option value="">All enquiries</option><option value="new">New</option><option value="reviewing">Reviewing</option><option value="awaiting_customer">Awaiting customer</option><option value="quoted">Quoted / invoiced</option><option value="closed">Closed</option></select><button id="load">Load enquiries</button></div><p class="muted">The admin key is sent only to protected Vico Pay admin endpoints. Do not share it.</p><div id="notice" class="msg" style="display:none"></div></div><div id="list"></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];
function headers(){return {'Content-Type':'application/json','x-admin-key':$('key').value.trim()}}
function notice(t,bad=false){$('notice').style.display='block';$('notice').textContent=t;$('notice').className='msg'+(bad?' danger':'')}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'Request failed');return j}
async function load(){if(!$('key').value.trim())return notice('Enter your admin key first.',true);$('list').textContent='Loading...';try{const j=await api('/api/admin/global-enquiries'+($('filter').value?'?status='+encodeURIComponent($('filter').value):''));rows=j.enquiries||[];render();notice('Loaded '+rows.length+' enquiries.');}catch(e){$('list').textContent='';notice(e.message,true)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!rows.length){$('list').innerHTML='<div class="card">No enquiries found.</div>';return}$('list').innerHTML=rows.map(x=>`<article class="card"><div class="head"><div><span class="tag">${esc(x.status)}</span> <b>${esc(x.reference)}</b></div><small class="muted">${new Date(Number(x.created_at)).toLocaleString()}</small></div><h2>${esc(x.subject)}</h2><div class="grid"><div><b>${esc(x.name)}</b><br>${esc(x.email)}<br>${esc(x.phone)}<p>${esc(x.organisation)} · ${esc(x.organisation_type)} · ${esc(x.country)}</p></div><div><b>Category:</b> ${esc(x.category)}<br><b>Budget:</b> ${esc(x.budget||'Not supplied')}<br><b>Invoices:</b> ${esc(x.invoice_count)}</div></div><div class="detail">${esc(x.message)}</div>${x.admin_reply?'<p><b>Previous response:</b></p><div class="detail">'+esc(x.admin_reply)+'</div>':''}<div class="actions"><section><h3>Send Vico Pay response</h3><textarea id="reply-${x.id}" placeholder="Write an official response...">${esc(x.admin_reply||'')}</textarea><select id="status-${x.id}"><option value="awaiting_customer">Awaiting customer</option><option value="reviewing">Reviewing</option><option value="quoted">Quoted</option><option value="closed">Closed</option></select><button style="margin-top:9px" onclick="reply(${x.id})">Send response</button></section><section><h3>Create Paystack invoice</h3><input id="desc-${x.id}" placeholder="Invoice description" value="${esc('Vico Pay services — '+x.subject)}"><div class="grid" style="margin-top:8px"><input id="amount-${x.id}" type="number" min="1" step="0.01" placeholder="Amount in NGN"><input id="due-${x.id}" type="date"></div><button style="margin-top:9px" onclick="invoice(${x.id})">Create & email invoice</button><p class="muted">Paystack sends the invoice to ${esc(x.email)}. Payment status is updated by the Paystack webhook.</p></section></div></article>`).join('')}
async function reply(id){try{const j=await api('/api/admin/global-enquiries/'+id+'/reply',{method:'POST',body:JSON.stringify({reply:$('reply-'+id).value,status:$('status-'+id).value})});notice(j.message);load()}catch(e){notice(e.message,true)}}
async function invoice(id){try{const j=await api('/api/admin/global-enquiries/'+id+'/invoice',{method:'POST',body:JSON.stringify({description:$('desc-'+id).value,amountNgn:$('amount-'+id).value,dueDate:$('due-'+id).value})});notice('Invoice created. Paystack request: '+j.invoice.requestCode+' · ₦'+Number(j.invoice.amountNgn).toLocaleString());load()}catch(e){notice(e.message,true)}}
$('load').addEventListener('click',load);$('filter').addEventListener('change',load);window.reply=reply;window.invoice=invoice;
</script></body></html>
