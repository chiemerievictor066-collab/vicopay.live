<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PK Battles - VicoPay Live</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050812;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #22304b;background:#071025}.logo{font-weight:900;font-size:23px;margin-right:auto}.logo span{color:#20d8ff}
header a{color:#cfe3ff;text-decoration:none;font-weight:700;font-size:14px}.wrap{width:min(900px,94%);margin:22px auto}h1{margin:0 0 4px}.sub{color:#8fa7c5;margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid #2a4066;background:#0a1328;color:#cfe3ff;border-radius:20px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.tab.on{background:#0787ed;border-color:#0787ed;color:#fff}
.row{display:flex;align-items:center;gap:12px;background:#0a1328;border:1px solid #203352;border-radius:14px;padding:12px 14px;margin-bottom:10px}.row .g{flex:1;min-width:0}.nm{font-weight:900}.s{color:#8fa7c5;font-size:12px;margin-top:2px}
.b{border:0;border-radius:18px;padding:8px 14px;font:inherit;font-weight:900;cursor:pointer;color:#fff;background:#0787ed;text-decoration:none;font-size:13px;white-space:nowrap}.b.on{background:#1f2f4d;color:#9bb0ca}.b.live{background:#ff315a}
.empty{padding:30px;text-align:center;color:#8fa7c5;background:#0a1328;border:1px dashed #2a4066;border-radius:14px}.lvl{background:#7c3aed;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.vs .sc{font-size:22px;font-weight:900;color:#ffd54a}.bar{height:12px;border-radius:7px;background:#ff315a;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#0787ed}
input.q{width:100%;padding:13px 16px;border-radius:24px;border:1px solid #2a4066;background:#0a1328;color:#fff;font:inherit;margin-bottom:14px}</style>
<script src="auth.js"></script><script>VicoAuth.requireLogin&&false&&VicoAuth.requireLogin();</script><script src="vico-ui.js"></script></head><body>
<header><div class="logo">VicoPay <span>Live</span></div><a href="live-room.html">Live</a><a href="hosts.html">Hosts</a><a href="followers.html">Followers</a><a href="pk-battles.html">PK</a><span id="bellSlot"></span></header><div class="wrap">
<h1>⚔️ PK Battles</h1><p class="sub">Two hosts go head to head. Gifts sent in either room become points. Highest score wins.</p>
<div id="mine"></div>
<div class="tabs"><button class="tab on" id="t1" onclick="tab(1)">Live battles</button><button class="tab" id="t2" onclick="tab(2)">Challenge a host</button><button class="tab" id="t3" onclick="tab(3)">Leaderboard</button></div><div id="list"></div>
<script>
const U=VicoUI;let cur=1;
function tab(n){cur=n;[1,2,3].forEach(i=>document.getElementById("t"+i).className="tab"+(i===n?" on":""));load();}
function mm(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
async function load(){
  if(cur===1){const d=await U.api("/api/pk/active");list.innerHTML=d.battles.length?d.battles.map(b=>{const t=b.a.score+b.b.score,p=t?Math.round(b.a.score/t*100):50;
    return '<div class="row" style="display:block"><div class="vs"><div>'+U.avatar(b.a.displayName,!!b.a.roomId,b.a.roomId,48,b.a.avatar)+'<div class="nm">'+U.esc(b.a.displayName)+'</div></div><div><div class="sc">'+U.num(b.a.score)+' : '+U.num(b.b.score)+'</div><div class="s">⚔️ Live PK</div></div><div>'+U.avatar(b.b.displayName,!!b.b.roomId,b.b.roomId,48,b.b.avatar)+'<div class="nm">'+U.esc(b.b.displayName)+'</div></div></div><div class="bar"><i style="width:'+p+'%"></i></div>'+
    (b.a.roomId?'<p style="text-align:center;margin:12px 0 0"><a class="b live" href="live-feed.html?room='+encodeURIComponent(b.a.roomId)+'">Watch</a></p>':'')+'</div>';}).join(""):'<div class="empty">No PK battles right now.</div>';}
  if(cur===2){if(!VicoAuth.isSignedIn()){list.innerHTML='<div class="empty">Sign in and start a live to challenge other hosts.</div>';return;}
    const d=await U.api("/api/pk/find-opponent");list.innerHTML='<p class="sub">You must be live to send a challenge. The other host has 60 seconds to accept. There is no timer: either host can stop the PK anytime.</p>'+
      (d.opponents&&d.opponents.length?d.opponents.map(o=>'<div class="row">'+U.avatar(o.displayName,true,null,null,o.avatar)+'<div class="g"><div class="nm">'+U.esc(o.displayName)+'</div><div class="s">'+U.esc(o.title)+' · 👁 '+U.num(o.viewers)+'</div></div><button class="b" onclick="invite(\''+o.handle+'\')">⚔️ Challenge</button></div>').join(""):'<div class="empty">No other hosts are live right now.</div>');}
  if(cur===3){const d=await U.api("/api/pk/leaderboard");list.innerHTML=d.ranking.length?d.ranking.map((r,i)=>'<div class="row"><b>#'+(i+1)+'</b>'+U.avatar(r.displayName,r.isLive,r.roomId,40,r.avatar)+'<div class="g"><div class="nm">'+U.esc(r.displayName)+'</div><div class="s">'+r.played+' battles</div></div><span class="lvl">'+r.wins+' wins</span></div>').join(""):'<div class="empty">No finished battles yet.</div>';}
}
async function invite(h){const d=await U.api("/api/pk/invite",{method:"POST",body:{hostId:h}});U.toast(d._ok?"Challenge sent!":(d.message||"Failed"));}
async function checkInvites(){if(!VicoAuth.isSignedIn())return;const d=await U.api("/api/pk/invites");
  mine.innerHTML=(d.invites||[]).map(i=>'<div class="row" style="border-color:#7c3aed"><div class="g"><div class="nm">⚔️ '+U.esc(i.from)+' challenges you</div><div class="s">'+'PK battle · '+i.secondsLeft+'s left to answer</div></div><button class="b" onclick="answer(\''+i.id+'\',true)">Accept</button><button class="b on" onclick="answer(\''+i.id+'\',false)">Decline</button></div>').join("");}
async function answer(id,yes){const d=await U.api("/api/pk/respond",{method:"POST",body:{inviteId:id,accept:yes}});U.toast(d._ok?(yes?"Battle started! Go back to your live.":"Declined"):(d.message||"Failed"));checkInvites();load();}
load();checkInvites();setInterval(()=>{if(cur===1)load();checkInvites();},4000);
</script></div><script>VicoUI.bell(document.getElementById("bellSlot"));</script></body></html>
