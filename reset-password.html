<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - VicoPay Live</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#e8eefc;background:linear-gradient(135deg,#06142f,#0b2f68,#32105f);padding:24px}.wrap{max-width:520px;margin:6vh auto;background:#07152bf2;border:1px solid #ffffff25;border-radius:22px;padding:34px;box-shadow:0 25px 80px #0009;line-height:1.6}.logo{font-size:26px;font-weight:900}.logo span{color:#38bdf8}h1{margin:18px 0 6px}a{color:#38bdf8}input{width:100%;padding:14px;border-radius:12px;border:1px solid #294266;background:#091a34;color:#fff;font:inherit;margin-top:10px}.btn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;background:#0787ed;color:#fff;font-weight:700;font:inherit;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;font-size:14px}.ok{background:#06381f;border:1px solid #16a34a}.err{background:#431122;border:1px solid #e11d48}</style></head><body>
<div class="wrap"><div class="logo">Vico<span>Pay</span> Live</div><h1>Choose a new password</h1>
<input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Repeat new password" autocomplete="new-password">
<button class="btn" id="go">Update password</button><div id="msg" class="msg"></div><p style="margin-top:24px"><a href="join-now.html">&larr; Back to sign in</a> &middot; <a href="forgot-password.html">Request a new link</a></p></div>
<script>
var token=new URLSearchParams(location.search).get("token")||"",go=document.getElementById("go"),msg=document.getElementById("msg");
function show(t,c){msg.textContent=t;msg.className="msg "+c;msg.style.display="block";}
if(!token)show("This page needs the link from your email.","err");
go.onclick=async function(){var a=p1.value,b=p2.value;if(a.length<8)return show("Password must be at least 8 characters.","err");if(a!==b)return show("The two passwords do not match.","err");
 go.disabled=true;
 try{var r=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,password:a})});var d=await r.json();
  if(r.ok&&d.success){show(d.message,"ok");setTimeout(function(){location.href="join-now.html";},1800);return;}show(d.message||"Could not reset password.","err");}catch(e){show("Network error. Please try again.","err");}
 go.disabled=false;};
</script></body></html>
