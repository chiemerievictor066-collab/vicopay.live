<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0646b8">
<title>VicoPay Live - Profile</title>
<link rel="stylesheet" href="vico.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef7ff;color:#082653;min-height:100vh;padding-bottom:84px}
.top{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(90deg,#031c5d,#0646b8,#087fe8);color:#fff}
.top a{color:#fff;text-decoration:none;font-weight:700}
.top .logo{font-size:20px;font-weight:900}.top .logo span{color:#13d1ff}
.top .sp{flex:1}
.wrap{max-width:900px;margin:22px auto;padding:0 16px}
.card{background:#fff;border:1px solid #cfe6fb;border-radius:20px;padding:26px;box-shadow:0 8px 24px rgba(0,72,150,.10);text-align:center}
.pic{position:relative;width:132px;height:132px;margin:0 auto 12px}
.pic .va{width:132px!important;height:132px!important;font-size:56px!important;box-shadow:0 0 0 4px #fff,0 0 0 7px #087fe8}
.pic.live .va{box-shadow:0 0 0 4px #fff,0 0 0 7px #ff315a}
.name{font-size:26px;font-weight:900;margin:8px 0 2px}
.handle{color:#66809a;margin-bottom:10px}
.bio{max-width:560px;margin:12px auto;line-height:1.6;color:#2b4a6f;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.stat{background:#eef7ff;border-radius:14px;padding:14px}
.stat b{display:block;font-size:21px;color:#0646b8}.stat span{font-size:13px;color:#66809a}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;background:#087fe8;color:#fff}
.btn.alt{background:#eef7ff;color:#0646b8;border:1px solid #cfe6fb}
.btn.live{background:#ff315a}
.btn.green{background:#16a34a}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.actions a{display:block;padding:15px;border-radius:12px;background:#eef7ff;border:1px solid #cfe6fb;color:#0646b8;font-weight:800;text-decoration:none;text-align:center}
/* edit window */
.ov{position:fixed;inset:0;background:rgba(3,28,93,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.box{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 6px}
.box label{display:block;font-weight:700;margin-top:14px;font-size:14px}
.box input[type=text],.box textarea{width:100%;padding:12px;border:1px solid #cfe6fb;border-radius:12px;font:inherit;margin-top:6px}
.cnt{font-size:12px;color:#66809a;text-align:right}
.ep{display:flex;align-items:center;gap:14px;margin-top:10px}
.ep .va{width:84px;height:84px;font-size:36px}
.ep .col{display:flex;flex-direction:column;gap:8px}
.ep .btn{padding:9px 14px;font-size:13px}
.msg{margin-top:12px;font-size:14px;font-weight:700}.msg.err{color:#ff315a}.msg.ok{color:#16a34a}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}}
</style>
<script src="auth.js"></script>
<script>VicoAuth.requireLogin();</script>
<script src="vico-ui.js"></script>
</head>
<body class="vico">
<div class="top">
  <a href="home.html" class="logo">VicoPay <span>Live</span></a>
  <span class="sp"></span>
  <a href="home.html">Home</a>
  <a href="live-room.html">Live</a>
  <a href="settings.html">⚙️</a>
</div>

<div class="wrap">
  <div class="card" id="card"><p>Loading profile…</p></div>
  <div class="card" id="mineActions" style="display:none;margin-top:18px;text-align:left">
    <div class="actions">
      <a href="live-room-dashboard.html">📊 Creator Dashboard</a>
      <a href="host-wallet.html">⭐ My Live Room Wallet</a>
      <a href="creator-withdrawal.html">💵 Creator Withdrawal</a>
      <a href="my-gifts.html">🎁 My Gifts</a>
      <a href="hosts.html">🏆 Host Ranking</a>
      <a href="gifters.html">🎁 Gifter Ranking</a>
      <a href="followers.html">👥 Followers / Following</a>
      <a href="settings.html">⚙️ Settings</a>
    </div>
    <div class="btns"><button class="btn alt" id="logoutBtn" type="button">Sign out</button></div>
  </div>
</div>

<!-- EDIT PROFILE WINDOW -->
<div class="ov" id="editOv">
  <div class="box">
    <h2>Edit Profile</h2>
    <div class="ep">
      <span id="editPic"></span>
      <div class="col">
        <label class="btn" style="margin:0;cursor:pointer">📷 Change photo
          <input id="fileIn" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
        </label>
        <button class="btn alt" id="removePic" type="button">Remove photo</button>
      </div>
    </div>
    <label for="nameIn">Display name</label>
    <input id="nameIn" type="text" maxlength="30" placeholder="Your name">
    <label for="bioIn">Bio</label>
    <textarea id="bioIn" rows="4" maxlength="160" placeholder="Tell people about yourself"></textarea>
    <div class="cnt"><span id="bioCnt">0</span>/160</div>
    <div class="msg" id="editMsg"></div>
    <div class="btns">
      <button class="btn alt" id="cancelEdit" type="button">Cancel</button>
      <button class="btn green" id="saveEdit" type="button">Save changes</button>
    </div>
  </div>
</div>

<script>
(function(){
  var U=VicoUI, $=function(i){return document.getElementById(i);};
  var params=new URLSearchParams(location.search);
  var handle=params.get("u")||"me";
  var P=null;

  function render(){
    var p=P, mine=p.isMe;
    var stats='<div class="stat"><b>'+U.num(p.followers)+'</b><span>Followers</span></div>'+
      '<div class="stat"><b>'+U.num(p.following)+'</b><span>Following</span></div>'+
      '<div class="stat"><b>'+U.num(p.giftsReceived)+'</b><span>Gifts received</span></div>'+
      '<div class="stat"><b>'+U.num(p.likes)+'</b><span>Likes</span></div>';
    var btns="";
    if(mine){
      btns='<button class="btn" id="editBtn" type="button">✏️ Edit Profile</button>';
    }else{
      if(p.isLive&&p.roomId)btns+='<a class="btn live" href="live-feed.html?room='+encodeURIComponent(p.roomId)+'">🔴 Watch Live</a>';
      btns+='<button class="btn'+(p.isFollowing?' alt':'')+'" id="followBtn" type="button">'+(p.isFollowing?"Following ✓":"Follow")+'</button>';
    }
    $("card").innerHTML=
      '<div class="pic'+(p.isLive?' live':'')+'">'+U.avatar(p.displayName,false,null,132,p.avatar)+'</div>'+
      '<div class="name">'+U.esc(p.displayName)+'</div>'+
      '<div class="handle">@'+U.esc(p.handle)+(p.isLive?' · <b style="color:#ff315a">LIVE</b>':'')+'</div>'+
      '<div class="bio">'+(p.bio?U.esc(p.bio):(mine?"Add a short bio so people can get to know you.":"No bio yet."))+'</div>'+
      '<div class="stats">'+stats+'</div>'+
      '<div class="btns">'+btns+'</div>';
    $("mineActions").style.display=mine?"block":"none";
    document.title=p.displayName+" - VicoPay Live";
    if(mine){
      U.setMe({handle:p.handle,displayName:p.displayName,avatar:p.avatar,bio:p.bio});
      $("editBtn").onclick=openEdit;
    }else{
      $("followBtn").onclick=toggleFollow;
    }
  }

  async function load(){
    var d=await U.api("/api/profile/"+encodeURIComponent(handle));
    if(!d._ok){$("card").innerHTML='<p>'+U.esc(d.message||"Profile not found.")+'</p><a class="btn" href="home.html">Go Home</a>';return;}
    P=d.profile;render();
    if(params.get("edit")==="1"&&P.isMe)openEdit();
  }

  async function toggleFollow(){
    var b=$("followBtn");b.disabled=true;
    var d=await U.api(P.isFollowing?"/api/unfollow":"/api/follow",{method:"POST",body:{hostId:P.handle}});
    b.disabled=false;
    if(!d._ok){U.toast(d.message||"Could not update follow.");return;}
    P.isFollowing=!P.isFollowing;
    P.followers=typeof d.followers==="number"?d.followers:Math.max(0,P.followers+(P.isFollowing?1:-1));
    render();
  }

  /* ---------- Edit profile ---------- */
  function paintEditPic(){$("editPic").innerHTML=U.avatar($("nameIn").value||P.displayName,false,null,84,(U.me()||{}).avatar||P.avatar);}
  function openEdit(){
    $("nameIn").value=P.displayName||"";$("bioIn").value=P.bio||"";
    $("bioCnt").textContent=$("bioIn").value.length;
    $("editMsg").textContent="";$("editMsg").className="msg";
    paintEditPic();$("editOv").classList.add("on");
  }
  function closeEdit(){$("editOv").classList.remove("on");}
  function say(t,ok){var m=$("editMsg");m.textContent=t;m.className="msg "+(ok?"ok":"err");}

  $("bioIn").oninput=function(){$("bioCnt").textContent=this.value.length;};
  $("cancelEdit").onclick=closeEdit;
  $("editOv").onclick=function(e){if(e.target===this)closeEdit();};
  $("fileIn").onchange=async function(){
    var f=this.files&&this.files[0];this.value="";if(!f)return;
    say("Uploading photo…",true);
    try{var url=await U.uploadAvatar(f);P.avatar=url;paintEditPic();render();say("Photo updated.",true);}
    catch(e){say(e.message,false);}
  };
  $("removePic").onclick=async function(){
    var d=await U.api("/api/profile/avatar/remove",{method:"POST",body:{}});
    if(!d._ok){say(d.message||"Could not remove the photo.",false);return;}
    P.avatar=null;U.setMe({avatar:null});paintEditPic();render();say("Photo removed.",true);
  };
  $("saveEdit").onclick=async function(){
    var name=$("nameIn").value.trim();
    if(name.length<2){say("Name must be at least 2 characters.",false);return;}
    $("saveEdit").disabled=true;
    var d=await U.api("/api/profile/update",{method:"POST",body:{displayName:name,bio:$("bioIn").value}});
    $("saveEdit").disabled=false;
    if(!d._ok){say(d.message||"Could not save your profile.",false);return;}
    P.displayName=d.displayName;P.bio=d.bio;
    U.setMe({displayName:d.displayName,bio:d.bio});
    render();say("Profile saved.",true);setTimeout(closeEdit,600);
  };
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeEdit();});
  $("logoutBtn").onclick=function(){VicoAuth.signOut();};

  load();
  U.bottomNav(handle==="me"?"me":"");
})();
</script>
</body>
</html>
