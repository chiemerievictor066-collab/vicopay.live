<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VicoPay Wallet</title>
<style>
  :root {
    --navy:#031c5d; --blue:#0646b8; --sky:#087fe8; --ice:#eef7ff; --mist:#d9eeff; --line:#cfe6fb;
    --ink:#082653; --muted:#5d7690; --ok:#16a34a; --bad:#d92d4b; --gold:#ffc83d;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); background:var(--ice); color:var(--ink); line-height:1.45; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 90px; }
  h1 { font-size:20px; margin:4px 0 14px; letter-spacing:.2px; }
  h2 { font-size:16px; margin:26px 0 10px; }
  .balance { background:var(--navy); color:#fff; border-radius:18px; padding:20px 20px 18px; }
  .balance small { display:block; color:#a9c6ec; font-size:13px; }
  .balance .amt { font-size:42px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; margin:2px 0 8px; }
  .balance .buys { font-size:13px; color:#cfe3ff; border-top:1px solid rgba(255,255,255,.18); padding-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
  .balance.low { background:#5b1a2a; }
  .low-note { display:none; margin-top:10px; font-size:13px; color:#ffd6dd; }
  .balance.low .low-note { display:block; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .opt { background:#fff; border:2px solid var(--line); border-radius:14px; padding:14px 6px 12px; text-align:center; cursor:pointer; font:inherit; color:var(--ink); }
  .opt b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .opt span { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .opt:hover { border-color:var(--sky); }
  .opt[aria-pressed="true"] { border-color:var(--blue); background:var(--mist); }
  .opt:focus-visible, .pay:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
  .pay { width:100%; margin-top:16px; padding:15px; border:0; border-radius:14px; background:var(--blue); color:#fff; font:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  .pay:disabled { background:#9db8de; cursor:not-allowed; }
  .methods { font-size:13px; color:var(--muted); margin-top:10px; text-align:center; }
  .msg { display:none; margin-top:14px; padding:12px 14px; border-radius:12px; font-size:14px; }
  .msg.show { display:block; }
  .msg.ok { background:#e3f7ea; color:#0f5c2c; }
  .msg.err { background:#fde8ec; color:#8a1730; }
  .msg.info { background:var(--mist); color:var(--ink); }
  .rates { background:#fff; border:1px solid var(--line); border-radius:14px; padding:4px 14px; }
  .rates div { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .rates div:last-child { border-bottom:0; }
  .hist { background:#fff; border:1px solid var(--line); border-radius:14px; }
  .hist .row { display:flex; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  .hist .row:last-child { border-bottom:0; }
  .hist .when { color:var(--muted); font-size:12px; }
  .plus { color:var(--ok); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .minus { color:var(--bad); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .empty { padding:18px 14px; color:var(--muted); font-size:14px; }
  @media (prefers-reduced-motion: no-preference) { .balance .amt { transition: color .3s; } .bump { color:var(--gold); } }
</style>
</head>
<body>
<main>
  <h1>VicoPay Wallet</h1>

  <section class="balance" id="balanceCard" aria-live="polite">
    <small>Available balance</small>
    <div class="amt" id="balance">₦0</div>
    <div class="buys" id="buys"></div>
    <div class="low-note" id="lowNote">Your balance is low. Recharge to keep sending messages and making calls.</div>
  </section>

  <div class="msg" id="msg" role="status"></div>

  <h2>Choose a recharge amount</h2>
  <div class="grid" id="grid"></div>
  <button class="pay" id="pay" disabled>Choose an amount</button>
  <div class="methods">Pay by card with Paystack. Your balance updates as soon as the payment is confirmed.</div>

  <h2>What things cost</h2>
  <div class="rates" id="rates"></div>

  <h2>Recent activity</h2>
  <div class="hist" id="hist"><div class="empty">Loading…</div></div>
</main>

<script src="auth.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var naira = function (n) { return "₦" + Number(n || 0).toLocaleString("en-NG"); };
  var state = { amount: 0, rates: { firstMessage: 3, message: 1, callMinute: 1 }, amounts: [100, 200, 500, 1000, 2000, 5000] };

  function show(kind, text) { var m = $("msg"); m.className = "msg show " + kind; m.textContent = text; }
  function hide() { $("msg").className = "msg"; }

  function api(path, opts) {
    return fetch(path, opts).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
  }

  function paintBalance(b) {
    var el = $("balance"), old = el.textContent;
    el.textContent = naira(b);
    if (old !== el.textContent) { el.classList.add("bump"); setTimeout(function () { el.classList.remove("bump"); }, 900); }
    var perMsg = state.rates.message, perMin = state.rates.callMinute;
    $("buys").innerHTML = "<span>" + Math.floor(b / perMsg).toLocaleString("en-NG") + " messages</span><span>" + Math.floor(b / perMin).toLocaleString("en-NG") + " call minutes</span>";
    $("balanceCard").classList.toggle("low", b < 20);
  }

  function paintGrid() {
    var g = $("grid"); g.innerHTML = "";
    state.amounts.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.setAttribute("aria-pressed", "false");
      b.innerHTML = "<b>" + naira(a) + "</b><span>" + Math.floor(a / state.rates.message).toLocaleString("en-NG") + " messages</span>";
      b.onclick = function () {
        state.amount = a;
        Array.prototype.forEach.call(g.children, function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
        $("pay").disabled = false; $("pay").textContent = "Pay " + naira(a) + " with card";
      };
      g.appendChild(b);
    });
  }

  function paintRates() {
    var r = state.rates;
    $("rates").innerHTML =
      "<div><span>First message to a new person</span><b>" + naira(r.firstMessage) + "</b></div>" +
      "<div><span>Each message after that</span><b>" + naira(r.message) + "</b></div>" +
      "<div><span>Voice or video call, per minute</span><b>" + naira(r.callMinute) + "</b></div>";
  }

  var LABEL = { recharge: "Wallet recharge", message: "Message", first_message: "First message", call: "Call" };
  function paintHistory(entries) {
    var h = $("hist");
    if (!entries.length) { h.innerHTML = '<div class="empty">No activity yet. Recharge to get started.</div>'; return; }
    h.innerHTML = "";
    entries.forEach(function (e) {
      var row = document.createElement("div"); row.className = "row";
      var left = document.createElement("div");
      var t = document.createElement("div"); t.textContent = e.memo || LABEL[e.kind] || "Wallet activity";
      var w = document.createElement("div"); w.className = "when"; w.textContent = new Date(e.at).toLocaleString("en-NG", { dateStyle: "medium", timeStyle: "short" });
      left.appendChild(t); left.appendChild(w);
      var amt = document.createElement("div"); amt.className = e.delta >= 0 ? "plus" : "minus";
      amt.textContent = (e.delta >= 0 ? "+" : "−") + naira(Math.abs(e.delta));
      row.appendChild(left); row.appendChild(amt); h.appendChild(row);
    });
  }

  function load() {
    return Promise.all([api("/api/wallet/balance"), api("/api/wallet/history?limit=30")]).then(function (res) {
      var b = res[0], h = res[1];
      if (b.success) {
        state.rates = b.rates || state.rates; state.amounts = b.amounts || state.amounts;
        paintBalance(b.balance); paintGrid(); paintRates();
        if (state.amount) { var i = state.amounts.indexOf(state.amount); if (i > -1) $("grid").children[i].click(); }
      } else { show("err", b.message || "Could not load your wallet. Please refresh."); }
      paintHistory(h.success ? h.entries : []);
    });
  }

  $("pay").onclick = function () {
    if (!state.amount) return;
    var btn = $("pay"); btn.disabled = true; btn.textContent = "Opening Paystack…"; hide();
    api("/api/wallet/recharge/initialize", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ amount: state.amount }) })
      .then(function (d) {
        if (d.success && d.authorization_url) { location.href = d.authorization_url; return; }
        show("err", d.message || "Could not start the payment. Please try again.");
        btn.disabled = false; btn.textContent = "Pay " + naira(state.amount) + " with card";
      })
      .catch(function () { show("err", "No connection. Check your internet and try again."); btn.disabled = false; btn.textContent = "Pay " + naira(state.amount) + " with card"; });
  };

  // Paystack sends the person back here with ?reference=...
  function confirmReturn() {
    var p = new URLSearchParams(location.search), ref = p.get("reference") || p.get("trxref");
    if (!ref) return Promise.resolve();
    show("info", "Confirming your payment…");
    var tries = 0;
    function once() {
      return api("/api/wallet/recharge/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reference: ref }) }).then(function (d) {
        if (d.success) { show("ok", d.alreadyProcessed ? "This recharge was already added to your wallet." : naira(d.amount) + " added to your wallet."); history.replaceState(null, "", "wallet.html"); return; }
        if (d.pending && ++tries < 4) return new Promise(function (r) { setTimeout(r, 2500); }).then(once);
        show("err", (d.message || "We could not confirm this payment.") + " If you were charged, your balance will update automatically within a few minutes.");
        history.replaceState(null, "", "wallet.html");
      });
    }
    return once();
  }

  confirmReturn().catch(function () { show("err", "Could not confirm the payment. If you were charged, your balance will update automatically."); }).then(load);
})();
</script>
</body>
</html>
